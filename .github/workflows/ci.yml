name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python -m sentineldesk generate-samples --out /tmp/samples
      - run: python -m sentineldesk analyze --ssh /tmp/samples/auth.log --windows /tmp/samples/windows_security.jsonl --web /tmp/samples/access.log --year 2026 --out /tmp/out
