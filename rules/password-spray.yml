id: password-spray
title: Password spraying (many accounts, one source)
severity: high
tactic: Credential Access
techniques: [T1110.003]
type: distinct
selection:
  action: login_failed
group_by: src_ip
distinct_field: user
count: 6
window: 900
description: >
  One source IP failed to log in as six or more different accounts within 15 minutes,
  the signature of a low-and-slow password spray that avoids per-account lockouts.
response:
  - Block the source IP and review every account it targeted for later successful logins.
  - Force a password reset and MFA enrolment for any account that was successfully accessed.
